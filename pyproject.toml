[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "p-h3-image-particle-sliders"
version = "0.3.0a1"
description = "Source-only P-H3 preparation using the released Anima gmix reference"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES/*.txt"]
dependencies = [
  "numpy>=1.26,<3",
  "particle-sliders-anima-gmix @ git+https://github.com/HyperGAN/particle-sliders.git@18ff6c18565263a693b4a85ba6680beb8d577a65#subdirectory=packages/particle-sliders-anima-gmix",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1"]

[project.scripts]
ph3-slider = "ph3_sliders.cli:main"

[project.urls]
Repository = "https://github.com/HyperGAN/p-h3-image-particle-sliders"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
