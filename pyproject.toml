[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "p-h3-image-particle-sliders"
version = "0.3.0.dev0"
description = "P-H3 image software fixtures and recorded fixed-bank profile"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "particle-sliders-core @ git+https://github.com/HyperGAN/particle-sliders.git@ec1161f5d74481be3540cb0dfa63d0e8f8b54e90#subdirectory=packages/particle-sliders-core",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1"]

[project.scripts]
ph3-slider = "ph3_sliders.cli:main"

[project.entry-points."particle_sliders.image_backends"]
ph3-image = "ph3_sliders.lifecycle:BACKEND"

[project.entry-points."particle_sliders.training_profiles"]
ph3-image-fixed-bank32 = "ph3_sliders.execution:profile"

[project.urls]
Repository = "https://github.com/HyperGAN/p-h3-image-particle-sliders"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
