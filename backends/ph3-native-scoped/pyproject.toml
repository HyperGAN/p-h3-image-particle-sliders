[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ph3-image-native-scoped"
version = "0.1.0"
description = "Opt-in cached fresh/FULL/RAW execution for the p-h3-image with the current shared runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6,<3",
    "particle-sliders-core @ git+https://github.com/HyperGAN/particle-sliders.git@ec1161f5d74481be3540cb0dfa63d0e8f8b54e90#subdirectory=packages/particle-sliders-core",
    "particlegan==0.11.1",
    "hndl==0.10.0",
    "diffusers @ git+https://github.com/huggingface/diffusers.git@35087a644038eb531f48581708d4763044cb4852",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ph3_native_scoped = ["source_profile.json", "native_runtime/runtime.json"]
